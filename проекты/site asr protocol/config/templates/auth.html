<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  {% load static %}
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Авторизация — ПротоСов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #f5f6f8;
      --bg-card: #ffffff;
      --text-primary: #2d3748;
      --text-secondary: #718096;
      --border-light: #e2e8f0;
      --accent-soft: #a8b5c9;
      --accent-wave: #8a9fb5;
      --accent-focus: #6b7c93;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #c53030;
      --shadow-soft: 0 4px 20px rgba(45, 55, 72, 0.08);
      --shadow-focus: 0 0 0 3px rgba(138, 159, 181, 0.25);
      --shadow-hover: 0 8px 30px rgba(107, 124, 147, 0.25);
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Manrope', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Фоновая волна — декоративный элемент */
    .wave-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }

    .wave-bg svg {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: auto;
      transform: scaleX(-1);
    }

    .wave-path {
      fill: none;
      stroke: var(--accent-soft);
      stroke-width: 1.5;
      stroke-dasharray: 12 8;
      animation: waveFlow 18s linear infinite;
    }

    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -200; }
    }

    .wave-bg .wave-path:nth-child(2) {
      stroke: var(--accent-wave);
      stroke-width: 1;
      stroke-dasharray: 8 12;
      animation-duration: 24s;
      animation-direction: reverse;
      opacity: 0.6;
    }

    .auth-shell {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      position: relative;
      z-index: 2;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .logo-wrap img {
      width: min(280px, 70vw);
      height: auto;
      max-height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));
      transition: transform 0.3s ease;
    }

    .logo-wrap img:hover {
      transform: scale(1.02);
    }

    .card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-top: 3px solid var(--accent-wave);
      padding: 40px 44px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: var(--shadow-soft);
      border-radius: 20px;
      animation: fadeUp 0.5s ease both;
      position: relative;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Заголовок формы — увеличенный и с акцентом */
    .form-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      margin: 4px 0 2px;
      letter-spacing: -0.02em;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .form-title::before,
    .form-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
      opacity: 0.6;
    }

    .form-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .form-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-left: 2px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--accent-soft);
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .form-wrapper input {
      width: 100%;
      padding: 14px 16px 14px 42px;
      background: #fafbfc;
      border: 1px solid var(--border-light);
      color: var(--text-primary);
      font-family: 'Manrope', sans-serif;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
      border-radius: 12px;
    }

    .form-wrapper input:focus {
      border-color: var(--accent-focus);
      box-shadow: var(--shadow-focus);
      background: #fff;
    }

    .form-wrapper input:focus + .input-icon,
    .input-wrapper:focus-within .input-icon {
      color: var(--accent-focus);
    }

    .form-wrapper input::placeholder { 
      color: var(--text-secondary); 
      opacity: 0.7;
    }

    /* Анимация "звуковой пульсации" при фокусе */
    .input-wrapper::after {
      content: '';
      position: absolute;
      top: 50%;
      right: 14px;
      width: 5px;
      height: 5px;
      background: var(--accent-wave);
      border-radius: 50%;
      opacity: 0;
      transform: translateY(-50%) scale(0.8);
      transition: all 0.2s ease;
    }

    .input-wrapper:focus-within::after {
      opacity: 1;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translateY(-50%) scale(0.8); opacity: 0.6; }
      50% { transform: translateY(-50%) scale(1.5); opacity: 1; }
    }

    .error {
      font-size: 13px;
      color: var(--error-text);
      text-align: center;
      padding: 12px 16px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 12px;
      line-height: 1.3;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--accent-wave), var(--accent-focus));
      color: #fff;
      font-family: 'Manrope', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.25s ease;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transition: left 0.5s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, var(--accent-focus), #5a6b82);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .btn-submit:hover::before {
      left: 100%;
    }

    .btn-submit:active {
      transform: translateY(0);
      transition-duration: 0.05s;
    }

    .btn-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Декоративные "звуковые линии" внизу карточки */
    .sound-lines {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 10px;
      padding-top: 16px;
      border-top: 1px dashed var(--border-light);
    }

    .sound-line {
      width: 4px;
      height: 14px;
      background: linear-gradient(to top, var(--accent-soft), var(--accent-wave));
      border-radius: 3px;
      animation: soundWave 2.4s ease-in-out infinite;
      opacity: 0.75;
    }

    .sound-line:nth-child(2) { animation-delay: -0.4s; height: 20px; }
    .sound-line:nth-child(3) { animation-delay: -0.8s; height: 28px; }
    .sound-line:nth-child(4) { animation-delay: -1.2s; height: 20px; }
    .sound-line:nth-child(5) { animation-delay: -1.6s; height: 14px; }

    @keyframes soundWave {
      0%, 100% { transform: scaleY(1); opacity: 0.65; }
      50% { transform: scaleY(1.7); opacity: 1; }
    }

    /* Маленький декоративный элемент в углу карточки */
    .card-corner {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      opacity: 0.5;
    }

    .card-corner svg {
      width: 100%;
      height: 100%;
    }

    .corner-wave {
      fill: none;
      stroke: var(--accent-soft);
      stroke-width: 1.5;
      stroke-linecap: round;
      animation: cornerPulse 3s ease-in-out infinite;
    }

    @keyframes cornerPulse {
      0%, 100% { opacity: 0.4; stroke-dashoffset: 0; }
      50% { opacity: 0.8; stroke-dashoffset: -10; }
    }

    @media (max-width: 560px) {
      .card { 
        padding: 34px 24px; 
        border-radius: 18px;
      }
      .form-title { font-size: 23px; }
      .sound-line { height: 12px; }
      .sound-line:nth-child(3) { height: 18px; }
      .form-wrapper input { font-size: 14px; padding-left: 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  
  <!-- Фоновые декоративные волны -->
  <div class="wave-bg" aria-hidden="true">
    <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
      <path class="wave-path" d="M0,0 C150,40 350,20 600,30 C850,40 1050,10 1200,25 L1200,120 L0,120 Z" />
      <path class="wave-path" d="M0,20 C200,60 400,30 600,45 C800,60 1000,25 1200,40 L1200,120 L0,120 Z" />
    </svg>
  </div>

  <div class="auth-shell">
    <div class="logo-wrap">
      <img src="{% static 'logo.svg' %}" alt="ПротоСов">
    </div>

    <div class="card">
      
      <!-- Декоративный уголок -->
      <div class="card-corner" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <path class="corner-wave" d="M5,35 Q20,20 35,5" />
        </svg>
      </div>

      <h1 class="form-title">Вход в систему</h1>
      <p class="form-subtitle">ПротоСов — платформа для обработки и анализа звука</p>
      
      <form class="form-wrapper" method="POST" action="{% url 'auth' %}">
        {% csrf_token %}

        {% if error %}
          <div class="error">{{ error }}</div>
        {% endif %}

        <div class="input-group">
          <label class="input-label" for="login">Логин</label>
          <div class="input-wrapper">
            <input type="text" id="login" name="login" placeholder="Введите логин" value="{{ login_value }}" autocomplete="username" required>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
        </div>
        
        <div class="input-group">
          <label class="input-label" for="password">Пароль</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="Введите пароль" autocomplete="current-password" required>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
        </div>
        
        <button type="submit" class="btn-submit">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12l14 0"></path>
            <path d="M13 18l6-6-6-6"></path>
          </svg>
          Войти
        </button>
      </form>

      <!-- Декоративные звуковые линии -->
      <div class="sound-lines" aria-hidden="true">
        <div class="sound-line"></div>
        <div class="sound-line"></div>
        <div class="sound-line"></div>
        <div class="sound-line"></div>
        <div class="sound-line"></div>
      </div>
    </div>
  </div>

</body>
</html>
